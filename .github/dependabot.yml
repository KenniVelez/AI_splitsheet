version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "/"
    # Auto-merge patch and minor updates
    auto-merge: true
    # Group updates to reduce PR volume
    groups:
      development:
        dependency-type: "development"
      production:
        dependency-type: "production"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    reviewers:
      - "KenniVelez"
    assignees:
      - "KenniVelez"
    labels:
      - "dependencies"
      - "automated"
    rebase-strategy: "auto"
